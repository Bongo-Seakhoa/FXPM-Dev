[pytest]
testpaths = tests

# No pinned --basetemp. An earlier version pinned .pytest-scratch to stop 138
# scratch trees landing in the repo root, and that fix created a worse defect:
# a FIXED basetemp is shared by every concurrent pytest process, so two agents
# running suites at once wipe each other's temp files mid-run. Codex measured
# it as 8 missing-temp-file failures with no failing assertion - the most
# expensive kind of breakage, because it looks like a real bug.
#
# pytest's default basetemp is already per-user and per-run under the system
# temp dir, and it garbage-collects old runs itself. The sprawl this was
# guarding against came from agents passing explicit --basetemp values into the
# repo, which the .gitignore patterns now catch. Pass an explicit --basetemp
# only when you need to inspect a specific run's artifacts.

# Delete scratch on success; pytest keeps the last 3 failing runs for triage.
tmp_path_retention_policy = failed
tmp_path_retention_count = 3

# Spool fixtures nest two 64-char content hashes under the tmp dir, which
# overruns the Windows 260-char path limit. Keep generated names short.
console_output_style = count
filterwarnings =
    error::DeprecationWarning:pm_.*
